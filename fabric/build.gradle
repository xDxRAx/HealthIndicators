architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = file("src/main/resources/healthindicators.accesswidener")
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    implementation("net.fabricmc:fabric-loader:$project.fabric_loader_version")
    implementation("net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version")
    implementation("dev.architectury:architectury-fabric:${project.architectury_api_version}")
    implementation("com.terraformersmc:modmenu:${project.modmenu}") { transitive false }
    implementation("dev.isxander:yet-another-config-lib:${project.yacl_fabric}") { transitive false }

    common(project(path: ':common')) { transitive false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    dependsOn configurations.common
    from({ zipTree(configurations.common.singleFile) }) {
        exclude 'META-INF/MANIFEST.MF', 'healthindicators.accesswidener'
    }
    from(rootProject.file('LICENSE'))
}

sourcesJar {
    from({ project(':common').sourceSets.main.allSource }) {
        exclude 'healthindicators.accesswidener'
    }
    from(rootProject.file('LICENSE'))
}
